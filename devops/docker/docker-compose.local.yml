name: ais-chat

services:
  postgres:
    # Use the same postgres version as in production
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: test1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d app_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  valkey:
    image: ghcr.io/valkey-io/valkey:9.1.1-alpine
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      CLIENT_NAME: ais-chat-dev-client
      CLIENT_SECRET: ClientSecret
    entrypoint: /opt/keycloak/data/import/entrypoint.sh
    volumes:
      - keycloak_data:/opt/keycloak/data/h2
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - '8080:8080'
    restart: unless-stopped
    depends_on:
      fix-keycloak-volume-ownership:
        condition: service_completed_successfully

  # keycloak runs with uid 1000, but docker creates volumes with root as owner; use a one-shot container to fix the permission
  fix-keycloak-volume-ownership:
    image: alpine
    restart: no
    entrypoint: /bin/sh -c "chown 1000 /keycloak"
    volumes:
      - keycloak_data:/keycloak

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_DEFAULT_USER: user
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  crawl4ai:
    image: unclecode/crawl4ai:0.9.2

    environment:
      CRAWL4AI_API_TOKEN: ais-chat-crawl4ai-token
    ports:
      - '11235:11235'
    deploy:
      resources:
        limits:
          memory: '2gb'
        reservations:
          memory: '1gb'
    shm_size: '2gb'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11235/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  xberg:
    image: ghcr.io/xberg-io/xberg:1.0.14-core
    environment:
      XBERG_MAX_UPLOAD_SIZE_MB: '50'
    ports:
      - '8000:8000'
    volumes:
      - xberg_cache:/app/.xberg
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  mock-llm:
    build:
      context: ./mock-llm
    restart: unless-stopped
    ports:
      - '6556:6556'

  bifrost:
    image: ghcr.io/maximhq/bifrost:v1.6.8
    restart: unless-stopped
    environment:
      BIFROST_ADMIN_USERNAME: admin
      BIFROST_ADMIN_PASSWORD: admin
      BIFROST_API_KEY: sk-bf-example-key
    ports:
      - '8089:8080'
    volumes:
      - ./bifrost/config.json:/app/data/config.json:ro
      - bifrost_data:/app/data

  llm-sandbox-dind:
    image: docker:28.3.3-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ''
    volumes:
      - llm_sandbox_dind_data:/var/lib/docker
    networks: [llm-sandbox-internal]
    healthcheck:
      test: ['CMD', 'docker', 'info']
      interval: 5s
      timeout: 5s
      retries: 12

  llm-sandbox-images:
    image: docker:28.3.3-cli
    restart: 'no'
    environment:
      DOCKER_HOST: tcp://llm-sandbox-dind:2375
    volumes:
      - ./llm-sandbox:/llm-sandbox:ro
    networks: [llm-sandbox-internal]
    depends_on:
      llm-sandbox-dind:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        docker pull python:3.12.10-slim-bookworm &&
        docker pull node:22.14.0-bookworm-slim &&
        docker build -t ais-chat/llm-sandbox-typescript:1 -f /llm-sandbox/Dockerfile.typescript /llm-sandbox

  llm-sandbox:
    build:
      context: ./llm-sandbox
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://llm-sandbox-dind:2375
      SANDBOX_GATEWAY_TOKEN: ${SANDBOX_GATEWAY_TOKEN:-local-llm-sandbox-token}
      SANDBOX_PYTHON_IMAGE: python:3.12.10-slim-bookworm
      SANDBOX_NODE_IMAGE: node:22.14.0-bookworm-slim
      SANDBOX_TYPESCRIPT_IMAGE: ais-chat/llm-sandbox-typescript:1
    ports:
      - '127.0.0.1:8091:8080'
    networks:
      - default
      - llm-sandbox-internal
    depends_on:
      llm-sandbox-dind:
        condition: service_healthy
      llm-sandbox-images:
        condition: service_completed_successfully
    tmpfs: ['/tmp:size=16m,noexec,nosuid']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  bifrost_data:
  keycloak_data:
  postgres_data:
  valkey_data:
  xberg_cache:
  llm_sandbox_dind_data:

networks:
  llm-sandbox-internal:
